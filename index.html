<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>주소 순서 스캐너</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js"></script>
<style>
/* Layout: one phone-width column. 목록(엑셀) → 카메라 + 실시간 결과 → 찾은 기록.
   Dark on purpose: it is used with the camera view and the screen close to paper. */
:root {
  color-scheme: dark;
  --bg: #0B1211;
  --surface: #141E1D;
  --surface2: #1B2827;
  --ink: #E6EEED;
  --muted: #8FA3A0;
  --line: #263634;
  --accent: #5CCFCB;
  --accent-ink: #062120;
  --ok: #5BD08A;
  --ok-bg: #12301F;
  --warn: #F0B44C;
  --warn-bg: #33270F;
  --bad: #FF8A80;
  --font-body: "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { background: var(--bg); }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font: 400 15px/1.55 var(--font-body);
  padding-block: max(16px, env(safe-area-inset-top, 0px)) max(40px, env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.wrap { max-width: 640px; margin: 0 auto; display: flex; flex-direction: column; gap: 24px; min-width: 0; }
header { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
h1 { font-size: 22px; font-weight: 700; margin: 0; letter-spacing: -0.01em; text-wrap: balance; }
.lede { margin: 4px 0 0; color: var(--muted); font-size: 14px; }
h2 { font-size: 13px; font-weight: 700; letter-spacing: 0.04em; color: var(--muted); margin: 0; }
section { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.chip { flex: none; font-size: 12px; font-weight: 700; padding: 3px 10px; border-radius: 99px; background: var(--surface2); color: var(--muted); border: 1px solid var(--line); white-space: nowrap; }
.chip.ready { color: var(--ok); border-color: var(--ok); }
.chip.busy { color: var(--warn); border-color: var(--warn); }
.chip.err { color: var(--bad); border-color: var(--bad); }

.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 14px; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.muted { color: var(--muted); font-size: 13px; margin: 0; }
.listname { font-weight: 700; overflow-wrap: anywhere; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
.grid2 label { display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: var(--muted); min-width: 0; }
select { min-height: 40px; width: 100%; font: 400 14px var(--font-body); color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 0 8px; min-width: 0; }
.preview { overflow-x: auto; border: 1px solid var(--line); border-radius: 8px; }
.preview table { border-collapse: collapse; width: 100%; font-size: 13px; }
.preview td { padding: 5px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
.preview tr:last-child td { border-bottom: 0; }
.preview td:first-child { font-family: var(--font-mono); color: var(--accent); font-weight: 700; text-align: right; }

.row { display: flex; gap: 10px; flex-wrap: wrap; }
.row > * { flex: 1 1 140px; min-width: 0; }
button, .btn {
  font: 500 15px var(--font-body); min-height: 46px; padding: 0 16px; border-radius: 10px;
  border: 1px solid var(--line); background: var(--surface2); color: var(--ink); cursor: pointer;
  display: inline-flex; align-items: center; justify-content: center; text-align: center;
}
button:disabled { opacity: .45; cursor: not-allowed; }
.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 700; }
.stopbtn { background: #5A2320; border-color: #8A3731; color: #FFD9D5; font-weight: 700; }
.small { min-height: 36px; font-size: 13px; padding: 0 12px; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
input[type="file"] { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; }
.status { min-height: 1.4em; font-size: 14px; color: var(--muted); }
.status.err { color: var(--bad); } .status.warn { color: var(--warn); } .status.ok { color: var(--ok); }

/* camera: overlay fractions map 1:1 to the video because the box takes the stream's aspect ratio */
.cam { position: relative; width: min(100%, calc(60vh * var(--ar, 1.3333))); aspect-ratio: var(--ar, 1.3333); margin: 0 auto; background: #000; border-radius: 10px; overflow: hidden; border: 1px solid var(--line); max-width: 100%; }
.cam video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; display: block; }
.reticle { position: absolute; left: 4%; width: 92%; top: 35%; height: 30%; border: 2px solid var(--accent); border-radius: 8px; box-shadow: 0 0 0 999px rgba(0,0,0,.5); transition: border-color .15s, top .15s, height .15s; }
.reticle.hit { border-color: var(--ok); }
.reticle.near { border-color: var(--warn); }
.sweep { position: absolute; left: 0; right: 0; height: 2px; background: var(--accent); opacity: 0; top: 0; }
.cam.on .sweep { opacity: .7; animation: sweep 1.6s ease-in-out infinite alternate; }
@keyframes sweep { from { top: 4%; } to { top: 94%; } }
@media (prefers-reduced-motion: reduce) { .cam.on .sweep { animation: none; top: 50%; } }
.camMsg { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; text-align: center; padding: 20px; color: var(--muted); font-size: 14px; }
.cam.on .camMsg { display: none; }
.readline { font: 400 12.5px var(--font-mono); color: var(--muted); min-height: 1.5em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

.live { display: flex; gap: 14px; align-items: center; background: var(--surface); border: 1px solid var(--line); border-left-width: 6px; border-radius: 10px; padding: 14px; min-height: 96px; min-width: 0; }
.live.ok { border-left-color: var(--ok); background: var(--ok-bg); }
.live.near { border-left-color: var(--warn); background: var(--warn-bg); }
.live.none { border-left-color: var(--bad); }
.live .ord { flex: none; min-width: 84px; text-align: center; line-height: 1; }
.live .ord b { display: block; font: 700 46px var(--font-mono); letter-spacing: -0.03em; font-variant-numeric: tabular-nums; }
.live .ord span { font-size: 13px; color: var(--muted); }
.live.ok .ord b { color: var(--ok); } .live.near .ord b { color: var(--warn); } .live.none .ord b { color: var(--bad); font-size: 24px; }
.live .body { min-width: 0; flex: 1; display: flex; flex-direction: column; gap: 4px; }
.live .tag { font-size: 13px; font-weight: 700; }
.live.ok .tag { color: var(--ok); } .live.near .tag { color: var(--warn); } .live.none .tag { color: var(--bad); }
.live .addr { overflow-wrap: anywhere; }
.live .refaddr { font-size: 12.5px; color: var(--muted); overflow-wrap: anywhere; }
.live.idle { color: var(--muted); }
.live .accept { align-self: flex-start; min-height: 38px; font-size: 14px; margin-top: 4px; }

.tally { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.tally b { font: 700 20px var(--font-mono); font-variant-numeric: tabular-nums; }
.hist { display: flex; flex-direction: column; gap: 6px; }
.h { display: flex; align-items: center; gap: 12px; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 8px 8px 8px 12px; min-width: 0; }
.h .n { flex: none; min-width: 52px; text-align: right; font: 700 22px var(--font-mono); color: var(--ok); font-variant-numeric: tabular-nums; }
.h .t { min-width: 0; flex: 1; }
.h .t div { overflow-wrap: anywhere; }
.h .t small { color: var(--muted); font-size: 12px; }
.h button { flex: none; min-height: 36px; width: 36px; padding: 0; font-size: 18px; }
.h.new { animation: pop .5s ease-out; }
@keyframes pop { from { background: var(--ok-bg); } }
details summary { cursor: pointer; font-size: 13px; font-weight: 700; color: var(--muted); padding: 4px 0; }
.missing { font: 400 13px/1.7 var(--font-mono); color: var(--muted); overflow-wrap: anywhere; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>주소 순서 스캐너</h1>
      <p class="lede">카메라로 주소를 비추면 자동으로 읽고, 엑셀 목록의 몇 번째인지 알려줍니다.</p>
    </div>
    <span class="chip busy" id="engine">엔진 준비 중</span>
  </header>

  <section aria-labelledby="h-list">
    <h2 id="h-list">1. 원본 주소 목록</h2>
    <div class="panel">
      <p class="muted" id="noList">엑셀(.xlsx, .xls) 또는 CSV 파일을 올리세요. 위에서부터 1번, 2번으로 셉니다. 순서 열이 따로 있으면 그 값을 써요.</p>
      <div id="hasList" hidden>
        <div class="listname" id="listName"></div>
        <p class="muted" id="listInfo"></p>
      </div>
      <div class="grid2" id="ctrls" hidden>
        <label id="sheetWrap" hidden>시트<select id="sheet"></select></label>
        <label>주소가 있는 열<select id="addrCol"></select></label>
        <label>순서 기준<select id="ordCol"></select></label>
      </div>
      <div class="preview" id="preview" hidden><table><tbody id="previewBody"></tbody></table></div>
      <div class="row">
        <label class="btn primary" for="xls" id="xlsBtn" tabindex="0" role="button">엑셀 파일 올리기</label>
        <button id="listClear" hidden>목록 지우기</button>
      </div>
      <input id="xls" type="file" accept=".xlsx,.xls,.csv,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet,application/vnd.ms-excel,text/csv">
      <div class="status" id="listStatus" role="status" aria-live="polite"></div>
    </div>
  </section>

  <section aria-labelledby="h-scan">
    <h2 id="h-scan">2. 자동 스캔</h2>
    <div class="cam" id="cam">
      <video id="v" playsinline muted></video>
      <div class="reticle" id="ret"><div class="sweep"></div></div>
      <div class="camMsg" id="camMsg">아래 "스캔 시작"을 누르면 카메라가 켜집니다.</div>
    </div>
    <div class="readline" id="readline" aria-hidden="true">&nbsp;</div>
    <div class="live idle" id="live" aria-live="polite">
      <div class="body"><div class="tag">주소를 네모 안에 맞춰 주세요</div><div class="muted">글자가 또렷하고 반듯하게 보이면 자동으로 찾습니다.</div></div>
    </div>
    <div class="row">
      <button class="primary" id="toggle">스캔 시작</button>
      <button id="size">스캔 영역: 보통</button>
    </div>
    <label class="btn small" for="photo" id="photoBtn" tabindex="0" role="button">사진 파일로 한 장 판독</label>
    <input id="photo" type="file" accept="image/*">
    <div class="status" id="status" role="status" aria-live="polite"></div>
  </section>

  <section aria-labelledby="h-hist">
    <h2 id="h-hist">3. 찾은 기록</h2>
    <div class="tally"><span class="muted">목록에서 찾은 주소</span><span><b id="foundN">0</b> <span class="muted">/ <span id="totalN">0</span></span></span></div>
    <div class="hist" id="hist"><p class="muted">찾은 주소가 여기에 쌓입니다.</p></div>
    <details id="missBox">
      <summary>아직 못 찾은 번호 보기</summary>
      <div class="missing" id="missing"></div>
    </details>
    <div class="row">
      <button class="small" id="copy">결과 복사</button>
      <button class="small" id="save">엑셀로 저장</button>
      <button class="small" id="reset">기록 지우기</button>
    </div>
  </section>
</div>

<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var list = [], ctx = null, wb = null, listFileName = '';
  var found = new Map();          // list index -> {a, o, t}
  var worker = null, engineReady = false;
  var stream = null, scanning = false, busy = false, streak = {}, lastSig = null, lastLiveAt = 0, wake = null, audio = null;
  var SIZES = [{ n: '좁게', h: 0.18 }, { n: '보통', h: 0.30 }, { n: '넓게', h: 0.50 }], sizeIdx = 1;

  function say(id, msg, kind) { var s = $(id); s.textContent = msg || ''; s.className = 'status' + (kind ? ' ' + kind : ''); }

  /* ---------- matching ---------- */
  var PROV = /^\s*(서울특별시|서울시|서울|부산광역시|부산|대구광역시|대구|인천광역시|인천|광주광역시|광주|대전광역시|대전|울산광역시|울산|세종특별자치시|세종|경기도|경기|강원특별자치도|강원도|강원|충청북도|충북|충청남도|충남|전북특별자치도|전라북도|전북|전라남도|전남|경상북도|경북|경상남도|경남|제주특별자치도|제주도|제주)\s+/;
  function core(s) {
    return String(s).replace(/\[\?\]/g, '').replace(/\([^)]*\)|\[[^\]]*\]/g, ' ').replace(PROV, '')
      .toLowerCase().replace(/[,.·'"|_~`]/g, ' ').replace(/\s+/g, ' ').trim();
  }
  function nums(s) { return (core(s).match(/\d+(?:-\d+)?/g) || []); }
  function grams(n) { var g = new Set(); for (var i = 0; i < n.length - 1; i++) g.add(n.substr(i, 2)); return g; }
  function dice(a, b) { if (!a.size || !b.size) return 0; var c = 0; a.forEach(function (x) { if (b.has(x)) c++; }); return 2 * c / (a.size + b.size); }
  function bounded(h, nd) {
    if (nd.length < 6 || nd.length > h.length) return false;
    var i = h.indexOf(nd);
    while (i !== -1) {
      var b = h.charAt(i - 1), a = h.charAt(i + nd.length);
      var okB = !b || !/[0-9\-]/.test(b) || !/[0-9]/.test(nd.charAt(0));
      var okA = !a || !/[0-9\-]/.test(a) || !/[0-9]/.test(nd.charAt(nd.length - 1));
      if (okB && okA) return true;
      i = h.indexOf(nd, i + 1);
    }
    return false;
  }
  function prep(o, a) { var c = core(a), n = c.replace(/ /g, ''); return { o: String(o), a: a, n: n, s: c, nums: nums(a), g: grams(n) }; }
  function fixDigits(s) {   // OCR often reads 1 as l/I/| and 0 as O next to digits
    return s.replace(/([0-9])[lI|]/g, '$11').replace(/[lI|]([0-9])/g, '1$1').replace(/([0-9])[Oo]/g, '$10').replace(/[Oo]([0-9])/g, '0$1');
  }
  function matchLine(line) {
    var cs = core(line), n = cs.replace(/ /g, '');
    if (n.length < 4) return null;
    var nm = nums(line), g = grams(n), exact = [], best = null, bs = 0;
    for (var i = 0; i < list.length; i++) {
      var it = list[i], s;
      if (bounded(n, it.n) || bounded(cs, it.s) || (n.length >= 8 && (bounded(it.n, n) || bounded(it.s, cs)))) s = 1;
      else {
        s = dice(g, it.g);
        if (it.nums.length && !it.nums.every(function (x) { return nm.indexOf(x) !== -1; })) s = Math.min(s, 0.6);
      }
      if (s === 1) exact.push(it); else if (s > bs) { bs = s; best = it; }
    }
    if (exact.length) return { st: 'ok', hits: exact, score: 1 };
    if (best && bs >= 0.88) return { st: 'ok', hits: [best], score: bs };
    if (best && bs >= 0.62) return { st: 'near', hits: [best], score: bs };
    return { st: 'none', hits: [], score: bs };
  }
  function analyze(text) {
    var ls = text.split('\n').map(function (l) { return fixDigits(l).trim(); }).filter(function (l) { return l.replace(/\s/g, '').length >= 3; });
    var tiers = [ls.slice()], pairs = [];
    for (var i = 0; i < ls.length - 1; i++) pairs.push(ls[i] + ' ' + ls[i + 1]);
    tiers.push(pairs);
    if (ls.length > 2) tiers.push([ls.join(' ')]);
    var oks = [], near = null, any = false;
    for (var t = 0; t < tiers.length && !oks.length; t++) {
      tiers[t].forEach(function (c) {
        var m = matchLine(c); if (!m) return; any = true;
        if (m.st === 'ok') { if (!oks.some(function (x) { return x.key === keyOf(m.hits); })) oks.push({ text: c, hits: m.hits, key: keyOf(m.hits) }); }
        else if (m.st === 'near' && (!near || m.score > near.score)) near = { text: c, hit: m.hits[0], score: m.score };
      });
    }
    return { lines: ls, oks: oks, near: oks.length ? null : near, any: any };
  }
  function keyOf(hits) { return hits.map(function (h) { return list.indexOf(h); }).join(','); }

  /* ---------- excel list ---------- */
  function colLetter(i) { var s = ''; i++; while (i > 0) { var m = (i - 1) % 26; s = String.fromCharCode(65 + m) + s; i = Math.floor((i - 1) / 26); } return s; }
  function parseSheet(name) {
    var rows = XLSX.utils.sheet_to_json(wb.Sheets[name], { header: 1, raw: false, defval: '' }).map(function (r) { return r.map(function (c) { return String(c).trim(); }); });
    var ncol = rows.reduce(function (m, r) { return Math.max(m, r.length); }, 0), hIdx = -1;
    for (var i = 0; i < Math.min(5, rows.length); i++) if (rows[i].some(function (c) { return /주소|address/i.test(c); })) { hIdx = i; break; }
    var names = []; for (var c = 0; c < ncol; c++) names.push(hIdx >= 0 ? (rows[hIdx][c] || '') : '');
    var addrCol = -1, ordCol = -1;
    if (hIdx >= 0) {
      addrCol = names.findIndex(function (x) { return /주소|address/i.test(x); });
      ordCol = names.findIndex(function (x, k) { return k !== addrCol && /순서|순번|^no\.?$|번호/i.test(x); });
    }
    if (addrCol < 0) {
      var bl = -1;
      for (var k = 0; k < ncol; k++) { var tot = 0; rows.slice(0, 50).forEach(function (r) { tot += (r[k] || '').length; }); if (tot > bl) { bl = tot; addrCol = k; } }
    }
    ctx = { rows: rows, hIdx: hIdx, ncol: ncol, names: names };
    fillSelect($('addrCol'), addrCol); fillSelect($('ordCol'), ordCol, true);
  }
  function fillSelect(sel, val, withRow) {
    sel.textContent = '';
    if (withRow) { var o = document.createElement('option'); o.value = '-1'; o.textContent = '위에서부터 차례로'; sel.append(o); }
    for (var c = 0; c < ctx.ncol; c++) {
      var op = document.createElement('option'); op.value = String(c);
      op.textContent = colLetter(c) + '열' + (ctx.names[c] ? ' · ' + ctx.names[c] : ''); sel.append(op);
    }
    sel.value = String(val);
  }
  function buildList() {
    var a = +$('addrCol').value, oc = +$('ordCol').value, items = [], seq = 0;
    for (var r = ctx.hIdx + 1; r < ctx.rows.length; r++) {
      var addr = (ctx.rows[r][a] || '').trim(); if (!addr) continue; seq++;
      items.push(prep(oc >= 0 ? ((ctx.rows[r][oc] || '').trim() || String(seq)) : String(seq), addr));
    }
    list = items; found.clear(); streak = {};
    try { localStorage.setItem('addr-list', JSON.stringify({ name: listFileName, rows: list.map(function (it) { return [it.o, it.a]; }) })); } catch (e) {}
    showList(); renderHist();
  }
  function showList() {
    var has = list.length > 0;
    $('noList').hidden = has; $('hasList').hidden = !has; $('listClear').hidden = !has; $('preview').hidden = !has; $('ctrls').hidden = !ctx;
    $('xlsBtn').textContent = has ? '다른 파일로 바꾸기' : '엑셀 파일 올리기'; $('xlsBtn').classList.toggle('primary', !has);
    if (!has) return;
    $('listName').textContent = listFileName || '저장된 목록';
    $('listInfo').textContent = '주소 ' + list.length + '개 · 첫 주소가 ' + list[0].o + '번';
    var tb = $('previewBody'); tb.textContent = '';
    list.slice(0, 3).forEach(function (it) { var tr = document.createElement('tr'), a = document.createElement('td'), b = document.createElement('td'); a.textContent = it.o; b.textContent = it.a; tr.append(a, b); tb.append(tr); });
  }
  $('xls').addEventListener('change', function (e) {
    var f = e.target.files[0]; e.target.value = ''; if (!f) return;
    if (typeof XLSX === 'undefined') { say('listStatus', '엑셀을 읽는 부품을 불러오지 못했어요. 인터넷 연결을 확인하고 새로고침해 주세요.', 'err'); return; }
    var fr = new FileReader();
    fr.onload = function () {
      try {
        wb = XLSX.read(fr.result, { type: 'array' }); listFileName = f.name;
        var sh = $('sheet'); sh.textContent = '';
        wb.SheetNames.forEach(function (n) { var o = document.createElement('option'); o.value = n; o.textContent = n; sh.append(o); });
        $('sheetWrap').hidden = wb.SheetNames.length < 2;
        parseSheet(wb.SheetNames[0]); buildList();
        say('listStatus', list.length ? '' : '주소를 찾지 못했어요. 주소가 있는 열을 골라 주세요.', list.length ? '' : 'warn');
      } catch (err) { say('listStatus', '이 파일을 읽을 수 없어요. 엑셀(.xlsx) 또는 CSV 파일인지 확인해 주세요.', 'err'); }
    };
    fr.onerror = function () { say('listStatus', '파일을 열 수 없어요. 다시 올려 주세요.', 'err'); };
    fr.readAsArrayBuffer(f);
  });
  $('sheet').addEventListener('change', function () { parseSheet(this.value); buildList(); });
  $('addrCol').addEventListener('change', buildList);
  $('ordCol').addEventListener('change', buildList);
  $('listClear').addEventListener('click', function () {
    list = []; ctx = null; wb = null; listFileName = ''; found.clear(); streak = {};
    try { localStorage.removeItem('addr-list'); } catch (e) {}
    showList(); renderHist(); say('listStatus', '');
  });
  try {
    var sv = JSON.parse(localStorage.getItem('addr-list') || 'null');
    if (sv && sv.rows && sv.rows.length) { list = sv.rows.map(function (r) { return prep(r[0], r[1]); }); listFileName = sv.name || ''; }
  } catch (e) {}

  /* ---------- OCR engine ---------- */
  function setEngine(txt, cls) { var c = $('engine'); c.textContent = txt; c.className = 'chip ' + (cls || ''); }
  async function initEngine() {
    if (typeof Tesseract === 'undefined') { setEngine('엔진 없음', 'err'); say('status', '글자 인식 엔진을 불러오지 못했어요. 인터넷 연결을 확인하고 새로고침해 주세요.', 'err'); return; }
    try {
      worker = await Tesseract.createWorker('kor+eng', 1, {
        logger: function (m) {
          if (m && /loading|initializing/.test(m.status || '')) setEngine('모델 준비 ' + Math.round((m.progress || 0) * 100) + '%', 'busy');
        }
      });
      await worker.setParameters({ tessedit_pageseg_mode: '6', preserve_interword_spaces: '1' });
      engineReady = true; setEngine('스캔 준비 완료', 'ready');
      if (scanning) say('status', '');
    } catch (e) { setEngine('엔진 오류', 'err'); say('status', '글자 인식 엔진을 시작하지 못했어요. 인터넷 연결을 확인하고 새로고침해 주세요.', 'err'); }
  }

  /* ---------- image prep ---------- */
  var work = document.createElement('canvas'), wctx = work.getContext('2d', { willReadFrequently: true });
  var tiny = document.createElement('canvas'), tctx = tiny.getContext('2d', { willReadFrequently: true });
  tiny.width = 32; tiny.height = 12;
  function prepCanvas(src, sx, sy, sw, sh, maxW) {
    var W = Math.max(64, Math.min(maxW, Math.round(sw))), H = Math.max(16, Math.round(sh * W / sw));
    work.width = W; work.height = H;
    wctx.drawImage(src, sx, sy, sw, sh, 0, 0, W, H);
    var id = wctx.getImageData(0, 0, W, H), d = id.data, hist = new Uint32Array(256), i, g;
    for (i = 0; i < d.length; i += 4) { g = (d[i] * 299 + d[i + 1] * 587 + d[i + 2] * 114) / 1000 | 0; d[i] = g; hist[g]++; }
    var total = W * H, acc = 0, lo = 0, hi = 255;
    for (i = 0; i < 256; i++) { acc += hist[i]; if (acc >= total * 0.02) { lo = i; break; } }
    acc = 0; for (i = 255; i >= 0; i--) { acc += hist[i]; if (acc >= total * 0.02) { hi = i; break; } }
    var span = Math.max(30, hi - lo);
    for (i = 0; i < d.length; i += 4) { g = (d[i] - lo) * 255 / span; g = g < 0 ? 0 : g > 255 ? 255 : g; d[i] = d[i + 1] = d[i + 2] = g; }
    wctx.putImageData(id, 0, 0);
    tctx.drawImage(work, 0, 0, 32, 12);
    var td = tctx.getImageData(0, 0, 32, 12).data, sig = new Uint8Array(32 * 12);
    for (i = 0; i < sig.length; i++) sig[i] = td[i * 4];
    return sig;
  }
  function sigDiff(a, b) { if (!a || !b) return 99; var s = 0; for (var i = 0; i < a.length; i++) s += Math.abs(a[i] - b[i]); return s / a.length; }

  /* ---------- live results ---------- */
  function liveSet(cls, ord, unit, tag, addr, ref, acceptFn) {
    var L = $('live'); L.className = 'live ' + cls; L.textContent = '';
    if (ord) { var o = document.createElement('div'); o.className = 'ord'; var b = document.createElement('b'); b.textContent = ord; o.append(b); if (unit) { var s = document.createElement('span'); s.textContent = unit; o.append(s); } L.append(o); }
    var body = document.createElement('div'); body.className = 'body';
    var t = document.createElement('div'); t.className = 'tag'; t.textContent = tag; body.append(t);
    if (addr) { var a = document.createElement('div'); a.className = 'addr'; a.textContent = addr; body.append(a); }
    if (ref) { var r = document.createElement('div'); r.className = 'refaddr'; r.textContent = ref; body.append(r); }
    if (acceptFn) { var bt = document.createElement('button'); bt.className = 'accept'; bt.textContent = '맞아요, 기록하기'; bt.onclick = acceptFn; body.append(bt); }
    L.append(body);
    $('ret').className = 'reticle' + (cls === 'ok' ? ' hit' : cls === 'near' ? ' near' : '');
  }
  function liveIdle() {
    $('live').className = 'live idle'; $('live').textContent = '';
    var b = document.createElement('div'); b.className = 'body';
    var t = document.createElement('div'); t.className = 'tag'; t.textContent = scanning ? '찾는 중…' : '주소를 네모 안에 맞춰 주세요';
    var m = document.createElement('div'); m.className = 'muted'; m.textContent = '글자가 또렷하고 반듯하게 보이면 자동으로 찾습니다.';
    b.append(t, m); $('live').append(b); $('ret').className = 'reticle';
  }
  function beep() {
    try {
      if (!audio) return;
      var o = audio.createOscillator(), g = audio.createGain();
      o.frequency.value = 880; g.gain.value = 0.15; o.connect(g); g.connect(audio.destination);
      o.start(); o.stop(audio.currentTime + 0.12);
    } catch (e) {}
    try { if (navigator.vibrate) navigator.vibrate(70); } catch (e) {}
  }
  function pad(n) { return (n < 10 ? '0' : '') + n; }
  function commit(hit, readText, manual) {
    var idx = list.indexOf(hit);
    if (idx < 0 || found.has(idx)) return false;
    found.set(idx, { o: hit.o, a: hit.a, t: new Date(), read: readText });
    beep(); renderHist(idx); return true;
  }
  function showOk(entry, justNow) {
    var os = entry.hits.map(function (h) { return h.o; });
    liveSet('ok', os.slice(0, 3).join(', ') + (os.length > 3 ? '…' : ''), '번째',
      justNow ? '찾았어요 · 기록했어요' : '이미 기록한 주소예요', entry.text, entry.hits[0].a !== entry.text ? '목록: ' + entry.hits[0].a : '');
  }
  function handleText(text, once) {
    var r = analyze(text);
    var first = r.lines.slice(0, 2).join('  /  ');
    $('readline').textContent = first || ' ';
    var cur = {};
    r.oks.forEach(function (o) { cur[o.key] = o; });
    Object.keys(streak).forEach(function (k) { if (!cur[k]) delete streak[k]; });
    var shown = false;
    r.oks.forEach(function (o) {
      streak[o.key] = (streak[o.key] || 0) + 1;
      if (streak[o.key] >= 2 || once) {
        var target = o.hits.find(function (h) { return !found.has(list.indexOf(h)); });
        var fresh = target ? commit(target, o.text) : false;
        if (!shown) { showOk(o, fresh); shown = true; lastLiveAt = Date.now(); }
      } else if (!shown) {
        liveSet('near', o.hits[0].o, '번째?', '확인하는 중…', o.text, ''); shown = true; lastLiveAt = Date.now();
      }
    });
    if (!shown && r.near) {
      var n = r.near;
      liveSet('near', n.hit.o, '번째?', '확인 필요 · 비슷한 주소예요', n.text, '목록: ' + n.hit.a, function () { commit(n.hit, n.text, true); liveSet('ok', n.hit.o, '번째', '기록했어요', n.hit.a, ''); lastLiveAt = Date.now(); });
      lastLiveAt = Date.now(); shown = true;
    }
    if (!shown) {
      if (Date.now() - lastLiveAt > 2500) { if (r.any && r.lines.join('').length >= 8) liveSet('none', '없음', '', '목록에서 찾지 못했어요', r.lines[0], ''); else liveIdle(); }
    }
    return shown;
  }

  /* ---------- history ---------- */
  function renderHist(newIdx) {
    $('foundN').textContent = String(found.size); $('totalN').textContent = String(list.length);
    var box = $('hist'); box.textContent = '';
    var arr = Array.from(found.entries()).sort(function (a, b) { return b[1].t - a[1].t; });
    if (!arr.length) { var p = document.createElement('p'); p.className = 'muted'; p.textContent = list.length ? '찾은 주소가 여기에 쌓입니다.' : '먼저 위에서 주소 목록을 올려 주세요.'; box.append(p); }
    arr.forEach(function (e) {
      var d = document.createElement('div'); d.className = 'h' + (e[0] === newIdx ? ' new' : '');
      var n = document.createElement('div'); n.className = 'n'; n.textContent = e[1].o;
      var t = document.createElement('div'); t.className = 't';
      var a = document.createElement('div'); a.textContent = e[1].a;
      var s = document.createElement('small'); s.textContent = pad(e[1].t.getHours()) + ':' + pad(e[1].t.getMinutes()) + ':' + pad(e[1].t.getSeconds());
      t.append(a, s);
      var x = document.createElement('button'); x.textContent = '×'; x.setAttribute('aria-label', e[1].o + '번 기록 지우기');
      x.onclick = function () { found.delete(e[0]); streak = {}; renderHist(); };
      d.append(n, t, x); box.append(d);
    });
    var miss = []; list.forEach(function (it, i) { if (!found.has(i)) miss.push(it.o); });
    $('missing').textContent = miss.length ? (miss.slice(0, 300).join(', ') + (miss.length > 300 ? ' …외 ' + (miss.length - 300) + '개' : '')) : (list.length ? '모두 찾았어요.' : '');
  }
  function sortedFound() { return Array.from(found.values()).sort(function (a, b) { var x = parseFloat(a.o), y = parseFloat(b.o); return (isNaN(x) ? 1e9 : x) - (isNaN(y) ? 1e9 : y); }); }
  $('copy').addEventListener('click', async function () {
    var txt = sortedFound().map(function (e) { return e.o + '\t' + e.a; }).join('\n'); if (!txt) return;
    var b = this, old = b.textContent;
    try { await navigator.clipboard.writeText(txt); b.textContent = '복사했어요'; } catch (e) { b.textContent = '복사하지 못했어요'; }
    setTimeout(function () { b.textContent = old; }, 1600);
  });
  $('save').addEventListener('click', function () {
    var rows = sortedFound(); if (!rows.length) return;
    try {
      var aoa = [['순서', '주소', '판독 시각']].concat(rows.map(function (e) { return [e.o, e.a, pad(e.t.getHours()) + ':' + pad(e.t.getMinutes()) + ':' + pad(e.t.getSeconds())]; }));
      var w = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(w, XLSX.utils.aoa_to_sheet(aoa), '스캔 결과'); XLSX.writeFile(w, '스캔결과.xlsx');
    } catch (e) { say('status', '엑셀 파일로 저장하지 못했어요. "결과 복사"를 써 보세요.', 'err'); }
  });
  $('reset').addEventListener('click', function () { found.clear(); streak = {}; renderHist(); liveIdle(); });

  /* ---------- camera + loop ---------- */
  function applySize() {
    var s = SIZES[sizeIdx], r = $('ret'); r.style.height = (s.h * 100) + '%'; r.style.top = ((1 - s.h) / 2 * 100) + '%';
    $('size').textContent = '스캔 영역: ' + s.n;
  }
  $('size').addEventListener('click', function () { sizeIdx = (sizeIdx + 1) % SIZES.length; applySize(); lastSig = null; });
  async function startScan() {
    if (!list.length) { say('status', '먼저 위에서 주소 목록을 올려 주세요.', 'warn'); $('xlsBtn').focus(); return; }
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      say('status', '이 주소에서는 카메라를 쓸 수 없어요. 카메라는 https 주소에서만 열립니다. 아래 "사진 파일로 한 장 판독"은 쓸 수 있어요.', 'err'); return;
    }
    try {
      if (!audio) { var AC = window.AudioContext || window.webkitAudioContext; if (AC) audio = new AC(); }
      if (audio && audio.state === 'suspended') audio.resume();
    } catch (e) {}
    try {
      stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: 'environment' }, width: { ideal: 1920 }, height: { ideal: 1080 } }, audio: false });
    } catch (e) {
      say('status', e && e.name === 'NotAllowedError' ? '카메라 사용을 허용해 주세요. 주소창 옆 자물쇠에서 카메라를 허용한 뒤 다시 눌러 주세요.' : '카메라를 열 수 없어요. 다른 앱이 카메라를 쓰고 있는지 확인해 주세요.', 'err'); return;
    }
    var v = $('v'); v.srcObject = stream;
    try { await v.play(); } catch (e) {}
    await new Promise(function (res) { if (v.videoWidth) res(); else v.onloadedmetadata = function () { res(); }; });
    $('cam').style.setProperty('--ar', String(v.videoWidth / v.videoHeight));
    try {
      var tr = stream.getVideoTracks()[0], caps = tr.getCapabilities ? tr.getCapabilities() : {};
      if (caps.focusMode && caps.focusMode.indexOf('continuous') !== -1) await tr.applyConstraints({ advanced: [{ focusMode: 'continuous' }] });
    } catch (e) {}
    try { if (navigator.wakeLock) wake = await navigator.wakeLock.request('screen'); } catch (e) {}
    scanning = true; streak = {}; lastSig = null; lastLiveAt = 0;
    $('cam').classList.add('on'); $('toggle').textContent = '스캔 멈춤'; $('toggle').className = 'stopbtn';
    say('status', engineReady ? '' : '글자 인식 모델을 내려받는 중이에요. 처음 한 번만 걸리고, 끝나면 바로 시작합니다.', engineReady ? '' : 'warn');
    liveIdle(); tick();
  }
  function stopScan() {
    scanning = false;
    if (stream) { stream.getTracks().forEach(function (t) { t.stop(); }); stream = null; }
    $('v').srcObject = null; $('cam').classList.remove('on');
    try { if (wake) { wake.release(); wake = null; } } catch (e) {}
    $('toggle').textContent = '스캔 시작'; $('toggle').className = 'primary'; $('readline').textContent = ' '; liveIdle();
  }
  $('toggle').addEventListener('click', function () { if (scanning) stopScan(); else startScan(); });
  document.addEventListener('visibilitychange', function () { if (document.hidden && scanning) stopScan(); });

  async function tick() {
    if (!scanning || busy) return;
    if (!engineReady) { setTimeout(tick, 400); return; }
    busy = true;
    try {
      var v = $('v'), vw = v.videoWidth, vh = v.videoHeight;
      if (vw && vh) {
        var fh = SIZES[sizeIdx].h, sw = vw * 0.92, sh = vh * fh;
        var sig = prepCanvas(v, (vw - sw) / 2, (vh - sh) / 2, sw, sh, 1200);
        var still = sigDiff(sig, lastSig) < 2.5 && !Object.keys(streak).length;
        lastSig = sig;
        if (!still) {
          var res = await worker.recognize(work);
          if (scanning) handleText((res && res.data && res.data.text) || '', false);
        }
      }
    } catch (e) { say('status', '판독 중 문제가 생겼어요. 잠시 뒤 자동으로 다시 시도합니다.', 'warn'); }
    busy = false;
    if (scanning) setTimeout(tick, 150);
  }

  /* one still photo from a file */
  $('photo').addEventListener('change', async function (e) {
    var f = e.target.files[0]; e.target.value = ''; if (!f) return;
    if (!list.length) { say('status', '먼저 위에서 주소 목록을 올려 주세요.', 'warn'); return; }
    if (!engineReady) { say('status', '글자 인식 모델을 아직 준비하는 중이에요. 잠시 뒤 다시 시도해 주세요.', 'warn'); return; }
    if (busy) return;
    busy = true; say('status', '사진을 읽는 중이에요…');
    var url = URL.createObjectURL(f);
    try {
      var img = new Image(); img.src = url; await img.decode();
      prepCanvas(img, 0, 0, img.naturalWidth, img.naturalHeight, 1800);
      var res = await worker.recognize(work);
      var ok = handleText((res && res.data && res.data.text) || '', true);
      say('status', ok ? '' : '이 사진에서 목록의 주소를 찾지 못했어요. 더 가까이서 다시 찍어 보세요.', ok ? '' : 'warn');
    } catch (err) { say('status', '이 사진은 읽을 수 없어요. 다른 사진으로 시도해 주세요.', 'err'); }
    URL.revokeObjectURL(url); busy = false;
  });
  ['xlsBtn', 'photoBtn'].forEach(function (id) { $(id).addEventListener('keydown', function (e) { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); this.click(); } }); });

  applySize(); showList(); renderHist(); liveIdle(); initEngine();
})();
</script>
</body>
</html>
