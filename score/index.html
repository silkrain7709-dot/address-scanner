<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>테니스 점수판</title>
<meta name="theme-color" content="#0E1A12">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="점수판">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<style>
:root {
  color-scheme: dark;
  --bg: #0E1A12; --surface: #16251B; --surface2: #1E3024; --ink: #EAF2EC; --muted: #93A89A; --line: #2A4332;
  --ball: #D4F13A; --ball-ink: #1A2200; --p0: #5CCFCB; --p1: #FFB35C; --ok: #5BD08A; --warn: #F0B44C; --bad: #FF8A80;
  --font-body: "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", system-ui, sans-serif;
  --font-mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
[hidden] { display: none !important; }
html { background: var(--bg); }
body { margin: 0; background: var(--bg); color: var(--ink); font: 400 14px/1.4 var(--font-body); user-select: none; -webkit-user-select: none;
  padding-block: max(8px, env(safe-area-inset-top, 0px)) max(14px, env(safe-area-inset-bottom, 0px));
  padding-left: max(10px, env(safe-area-inset-left, 0px)); padding-right: max(10px, env(safe-area-inset-right, 0px)); }
.wrap { max-width: 640px; margin: 0 auto; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
header { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
h1 { font-size: 17px; margin: 0; } .clock { font: 600 13px var(--font-mono); color: var(--muted); }
button { font: 600 14px var(--font-body); min-height: 44px; padding: 0 10px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface2); color: var(--ink); cursor: pointer; display: inline-flex; align-items: center; justify-content: center; text-align: center; }
button:disabled { opacity: .4; }
button.primary { background: var(--ball); border-color: var(--ball); color: var(--ball-ink); font-weight: 800; }
:focus-visible { outline: 3px solid var(--ball); outline-offset: 2px; }

.board { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 6px 8px; }
.board table { width: 100%; border-collapse: collapse; }
.board th { font: 500 11px var(--font-body); color: var(--muted); text-align: center; padding: 0 2px 2px; }
.board td { padding: 5px 2px; text-align: center; font: 700 22px var(--font-mono); border-top: 1px solid var(--line); }
.board td.nm { text-align: left; font: 700 17px var(--font-body); width: 34%; max-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.board td.set { color: var(--muted); } .board td.set.w { color: var(--ink); }
.board td.set sup { font-size: 11px; font-weight: 600; }
.board td.cur { color: var(--ink); background: rgba(255,255,255,.04); } .board td.pt { color: var(--ball); font-size: 26px; min-width: 2.6ch; }
.board tr.p0 .nm { color: var(--p0); } .board tr.p1 .nm { color: var(--p1); }
.dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; background: var(--ball); margin-right: 6px; vertical-align: 1px; visibility: hidden; }
.dot.on { visibility: visible; }

.info { text-align: center; font-size: 13px; color: var(--muted); min-height: 1.4em; } .info b { color: var(--ball); }
.taps { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.tap { min-height: min(34vh, 250px); border-radius: 16px; border: 2px solid var(--c); background: var(--surface); color: var(--ink); flex-direction: column; gap: 4px; font-size: 20px; touch-action: manipulation; }
.tap .big { font: 800 56px/1 var(--font-mono); color: var(--c); } .tap .nm { font-weight: 700; overflow: hidden; text-overflow: ellipsis; max-width: 100%; white-space: nowrap; padding: 0 6px; } .tap small { font: 500 12px var(--font-body); color: var(--muted); }
.tap:active { background: var(--surface2); }
.rowb { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }

.win { text-align: center; background: #222E0A; border: 1px solid var(--ball); border-radius: 12px; padding: 10px; }
.win b { display: block; font-size: 22px; color: var(--ball); }

.setup { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 10px; display: flex; flex-direction: column; gap: 8px; }
.setup h2 { font-size: 15px; margin: 0; }
.setup label { display: flex; align-items: center; gap: 8px; font-size: 13px; } .setup label > span { flex: none; width: 92px; color: var(--muted); }
.setup input[type=text], .setup select { flex: 1; min-width: 0; min-height: 40px; font: 500 15px var(--font-body); color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 0 8px; user-select: text; -webkit-user-select: text; }
.setup .chk { min-height: 40px; } .setup input[type=checkbox] { width: 22px; height: 22px; accent-color: var(--ball); }
.stat { display: grid; grid-template-columns: 1fr auto 1fr; gap: 6px; font: 600 13px var(--font-mono); text-align: center; color: var(--muted); } .stat span:nth-child(2) { font-family: var(--font-body); }
</style>
</head>
<body>
<div class="wrap">
  <header><h1>테니스 점수판</h1><span class="clock" id="clock">00:00</span></header>

  <section id="match" hidden>
    <div class="board"><table id="tbl"></table></div>
    <div class="info" id="info"></div>
    <div class="win" id="win" hidden></div>
    <div class="taps" id="taps" style="margin-top:8px">
      <button class="tap" id="t0" style="--c:var(--p0)"><span class="nm" id="n0"></span><span class="big" id="b0">0</span><small>눌러서 점수 +1</small></button>
      <button class="tap" id="t1" style="--c:var(--p1)"><span class="nm" id="n1"></span><span class="big" id="b1">0</span><small>눌러서 점수 +1</small></button>
    </div>
    <div class="rowb" style="margin-top:8px">
      <button id="undo">↶ 되돌리기</button>
      <button id="swap">서브 바꾸기</button>
      <button id="newm">새 경기</button>
    </div>
    <div class="stat" style="margin-top:8px" id="stat"></div>
  </section>

  <section class="setup" id="setup">
    <h2 id="setupTitle">새 경기 설정</h2>
    <label><span>선수 1</span><input type="text" id="in0" maxlength="14" value="나"></label>
    <label><span>선수 2</span><input type="text" id="in1" maxlength="14" value="상대"></label>
    <label><span>경기 방식</span><select id="fmt"><option value="1">1세트 경기</option><option value="3" selected>3세트 (2세트 먼저)</option><option value="5">5세트 (3세트 먼저)</option></select></label>
    <label><span>마지막 세트</span><select id="last"><option value="tb" selected>6-6에서 타이브레이크(7점)</option><option value="super">슈퍼 타이브레이크(10점)로 결정</option><option value="adv">타이브레이크 없이 2게임 차</option></select></label>
    <label class="chk"><span>노어드</span><input type="checkbox" id="noad"><em style="font-style:normal;color:var(--muted)">40-40에서 한 점으로 결정</em></label>
    <label><span>첫 서브</span><select id="first"><option value="0">선수 1</option><option value="1">선수 2</option><option value="r">랜덤</option></select></label>
    <div class="rowb" style="grid-template-columns:1fr 1fr"><button id="cancelSetup" hidden>취소</button><button class="primary" id="start" style="grid-column:span 1">경기 시작</button></div>
  </section>
</div>

<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  function load(k, d) { try { var v = localStorage.getItem(k); return v === null ? d : v; } catch (e) { return d; } }
  function save(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }

  /* ---------- match model ---------- */
  var M = null, undoStack = [];
  function newMatch(o) {
    return { names: [o.n0 || '선수 1', o.n1 || '선수 2'], sets: o.sets, noAd: !!o.noAd, last: o.last, done: [], setsWon: [0, 0], g: [0, 0], p: [0, 0], mode: 'game', server: o.first, tbFirst: null, total: [0, 0], winner: null, t0: Date.now(), t1: null };
  }
  function need(m) { return Math.ceil(m.sets / 2); }
  function isFinalSet(m) { return m.sets === 1 || (m.setsWon[0] === need(m) - 1 && m.setsWon[1] === need(m) - 1); }
  function lastRule(m) { var r = isFinalSet(m) ? m.last : 'tb'; if (r === 'super' && m.sets === 1) r = 'tb'; return r; }
  function setWon(m, w, tbScore, stb, nextServer) {
    m.done.push({ g: m.g.slice(), tb: tbScore || null, stb: !!stb }); m.setsWon[w]++; m.g = [0, 0]; m.p = [0, 0]; m.tbFirst = null;
    if (m.setsWon[w] >= need(m)) { m.winner = w; m.mode = 'done'; m.t1 = Date.now(); return; }
    m.server = nextServer;
    if (m.sets > 1 && m.last === 'super' && m.setsWon[0] === need(m) - 1 && m.setsWon[1] === need(m) - 1) { m.mode = 'stb'; m.tbFirst = nextServer; } else m.mode = 'game';
  }
  function gameWon(m, w) {
    var srv = m.server; m.g[w]++; m.p = [0, 0];
    var a = m.g[w], b = m.g[1 - w];
    if (a >= 6 && a - b >= 2) { setWon(m, w, null, false, 1 - srv); return; }
    if (m.g[0] === 6 && m.g[1] === 6 && lastRule(m) !== 'adv') { m.mode = 'tb'; m.tbFirst = 1 - srv; m.server = m.tbFirst; return; }
    m.server = 1 - srv;
  }
  function addPoint(m, w) {
    if (m.winner !== null) return;
    m.total[w]++; m.p[w]++;
    var a = m.p[w], b = m.p[1 - w];
    if (m.mode === 'game') {
      if (m.noAd ? a >= 4 : (a >= 4 && a - b >= 2)) gameWon(m, w);
    } else {
      var target = m.mode === 'stb' ? 10 : 7;
      if (a >= target && a - b >= 2) {
        var first = m.tbFirst, tbs = m.p.slice(), stb = m.mode === 'stb';
        m.g[w]++; setWon(m, w, tbs, stb, 1 - first);
      } else { var k = m.p[0] + m.p[1]; m.server = (Math.floor((k + 1) / 2) % 2 === 0) ? m.tbFirst : 1 - m.tbFirst; }
    }
  }
  function ptLabel(m, i) {
    if (m.mode === 'tb' || m.mode === 'stb') return String(m.p[i]);
    var a = m.p[i], b = m.p[1 - i];
    if (m.noAd) return ['0', '15', '30', '40'][Math.min(a, 3)];
    if (a >= 3 && b >= 3) { if (a === b) return '40'; return a > b ? 'AD' : '40'; }
    return ['0', '15', '30', '40'][Math.min(a, 3)];
  }
  function infoText(m) {
    if (m.winner !== null) return '';
    var s = '서브: <b>' + esc(m.names[m.server]) + '</b>';
    var k = m.p[0] + m.p[1];
    if (m.mode === 'game') {
      s += ' · ' + (k % 2 === 0 ? '듀스 코트(오른쪽)' : '애드 코트(왼쪽)');
      if (m.p[0] >= 3 && m.p[1] >= 3) s += ' · ' + (m.noAd ? '<b>결승점</b>' : (m.p[0] === m.p[1] ? '<b>듀스</b>' : '<b>어드밴티지</b>'));
      else if (m.p[0] >= 3 || m.p[1] >= 3) { var l = m.p[0] > m.p[1] ? 0 : 1; if (m.p[l] >= 3 && m.p[l] > m.p[1 - l]) s += ' · ' + esc(m.names[l]) + ' 게임 포인트'; }
    } else s += ' · <b>' + (m.mode === 'stb' ? '슈퍼 타이브레이크(10점)' : '타이브레이크(7점)') + '</b>' + ' · ' + (k % 2 === 0 ? '오른쪽' : '왼쪽');
    return s;
  }
  function esc(t) { return String(t).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }

  /* ---------- storage / undo ---------- */
  function persist() { save('sb-match', JSON.stringify(M)); save('sb-undo', JSON.stringify(undoStack.slice(-120))); }
  function act(fn) { undoStack.push(JSON.stringify(M)); fn(); persist(); render(); }
  function point(w) { act(function () { addPoint(M, w); }); try { if (navigator.vibrate) navigator.vibrate(15); } catch (e) {} }
  function undo() { if (!undoStack.length) return; M = JSON.parse(undoStack.pop()); persist(); render(); }

  /* ---------- render ---------- */
  function render() {
    if (!M) { $('match').hidden = true; $('setup').hidden = false; return; }
    $('setup').hidden = true; $('match').hidden = false;
    var m = M, rows = '', head = '<tr><th></th>', i, s;
    for (s = 0; s < m.done.length; s++) head += '<th>' + (s + 1) + '세트</th>';
    if (m.winner === null) head += '<th>게임</th><th>점수</th>'; head += '</tr>';
    for (i = 0; i < 2; i++) {
      var tr = '<tr class="p' + i + '"><td class="nm"><span class="dot' + (m.winner === null && m.server === i ? ' on' : '') + '"></span>' + esc(m.names[i]) + (m.winner === i ? ' 🏆' : '') + '</td>';
      m.done.forEach(function (d) {
        var win = d.g[i] > d.g[1 - i], txt, sup = '';
        if (d.stb) txt = String(d.tb[i]); else { txt = String(d.g[i]); if (d.tb && !win) sup = '<sup>' + d.tb[i] + '</sup>'; }
        tr += '<td class="set' + (win ? ' w' : '') + '">' + txt + sup + '</td>';
      });
      if (m.winner === null) tr += '<td class="cur">' + m.g[i] + '</td><td class="pt">' + ptLabel(m, i) + '</td>';
      rows += tr + '</tr>';
    }
    $('tbl').innerHTML = head + rows;
    $('info').innerHTML = infoText(m);
    $('n0').textContent = m.names[0]; $('n1').textContent = m.names[1];
    $('b0').textContent = ptLabel(m, 0); $('b1').textContent = ptLabel(m, 1);
    $('taps').hidden = m.winner !== null; $('swap').disabled = m.winner !== null; $('undo').disabled = !undoStack.length;
    var wn = $('win'); wn.hidden = m.winner === null;
    if (m.winner !== null) wn.innerHTML = '<b>' + esc(m.names[m.winner]) + ' 승리!</b>' + m.done.map(function (d) { return d.stb ? '[' + d.tb[0] + '-' + d.tb[1] + ']' : d.g[0] + '-' + d.g[1] + (d.tb ? '(' + Math.min(d.tb[0], d.tb[1]) + ')' : ''); }).join('  ') + '<br>경기 시간 ' + fmtTime((m.t1 || Date.now()) - m.t0);
    $('stat').innerHTML = '<span>' + m.total[0] + '</span><span>총 득점</span><span>' + m.total[1] + '</span>';
    tickClock();
  }
  function fmtTime(ms) { var s = Math.floor(ms / 1000), h = Math.floor(s / 3600), mm = Math.floor(s % 3600 / 60), ss = s % 60; return (h ? h + ':' + ('0' + mm).slice(-2) : mm) + ':' + ('0' + ss).slice(-2); }
  function tickClock() { $('clock').textContent = M ? fmtTime((M.t1 || Date.now()) - M.t0) : ''; }
  setInterval(tickClock, 1000);

  /* ---------- events ---------- */
  $('t0').addEventListener('click', function () { point(0); });
  $('t1').addEventListener('click', function () { point(1); });
  $('undo').addEventListener('click', undo);
  $('swap').addEventListener('click', function () { if (M.mode !== 'game' && M.mode !== 'tb' && M.mode !== 'stb') return; act(function () { M.server = 1 - M.server; if (M.tbFirst !== null) M.tbFirst = 1 - M.tbFirst; }); });
  function openSetup(canCancel) {
    var o = {}; try { o = JSON.parse(load('sb-opts', '{}')) || {}; } catch (e) {}
    if (o.n0) $('in0').value = o.n0; if (o.n1) $('in1').value = o.n1; if (o.sets) $('fmt').value = String(o.sets); if (o.last) $('last').value = o.last; $('noad').checked = !!o.noAd;
    $('setupTitle').textContent = canCancel ? '새 경기 설정' : '경기를 시작해 보세요'; $('cancelSetup').hidden = !canCancel;
    $('setup').hidden = false; $('match').hidden = true; try { $('setup').scrollIntoView(); } catch (e) {}
  }
  $('newm').addEventListener('click', function () { if (M && M.winner === null && (M.total[0] + M.total[1]) > 0 && !confirm('진행 중인 경기를 끝내고 새 경기를 만들까요?')) return; openSetup(true); });
  $('cancelSetup').addEventListener('click', function () { render(); });
  $('start').addEventListener('click', function () {
    var o = { n0: $('in0').value.trim() || '선수 1', n1: $('in1').value.trim() || '선수 2', sets: parseInt($('fmt').value, 10), last: $('last').value, noAd: $('noad').checked };
    save('sb-opts', JSON.stringify(o));
    var f = $('first').value; o.first = f === 'r' ? (Math.random() < 0.5 ? 0 : 1) : parseInt(f, 10);
    M = newMatch(o); undoStack = []; persist(); render(); requestWake();
  });
  var wake = null; function requestWake() { try { if (navigator.wakeLock && !wake) navigator.wakeLock.request('screen').then(function (w) { wake = w; w.addEventListener('release', function () { wake = null; }); }, function () {}); } catch (e) {} }
  document.addEventListener('visibilitychange', function () { if (!document.hidden && M && M.winner === null) requestWake(); });

  try { M = JSON.parse(load('sb-match', 'null')); undoStack = JSON.parse(load('sb-undo', '[]')) || []; } catch (e) { M = null; undoStack = []; }
  if (M && M.names) { render(); requestWake(); } else { M = null; openSetup(false); }
  window.__sb = { newMatch: newMatch, addPoint: addPoint, ptLabel: ptLabel, get: function () { return M; } };
})();
</script>
</body>
</html>
